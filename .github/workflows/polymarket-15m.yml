name: Polymarket 15m Research Cycle

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      target_count:
        description: "Number of live Polymarket outcomes to collect"
        required: false
        default: "300"
      global_review:
        description: "Run global ML/correlation review"
        required: false
        default: "false"

jobs:
  call-vercel-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call managed Vercel cron endpoint
        env:
          VERCEL_CRON_URL: ${{ secrets.VERCEL_CRON_URL || 'https://polymarket-research-dashboard.vercel.app/api/cron-refresh' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_COUNT: ${{ github.event.inputs.target_count || '300' }}
          GLOBAL_REVIEW_INPUT: ${{ github.event.inputs.global_review || 'false' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_CRON_URL:-}" ]; then
            echo "Missing VERCEL_CRON_URL secret"
            exit 1
          fi
          GLOBAL_REVIEW="${GLOBAL_REVIEW_INPUT}"
          if [ "${SCHEDULE}" = "7 2 * * *" ]; then
            GLOBAL_REVIEW="true"
            TARGET_COUNT="600"
          fi
          URL="${VERCEL_CRON_URL}?source=live&cycle_type=scheduled_15m&target_count=${TARGET_COUNT}&global_review=${GLOBAL_REVIEW}"
          if [ -n "${CRON_SECRET:-}" ]; then
            curl --fail --show-error --silent \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${URL}" > response.json
          else
            curl --fail --show-error --silent "${URL}" > response.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("response.json").read_text())
          required = {
              "ok": True,
              "sourceMode": "live",
              "cycleType": "scheduled_15m",
              "research_only": True,
          }
          for key, expected in required.items():
              actual = payload.get(key)
              if actual != expected:
                  raise SystemExit(f"{key} expected {expected!r}, got {actual!r}: {payload}")
          if payload.get("intelligence_status") not in {"success", "partial"}:
              raise SystemExit(f"bad intelligence_status: {payload}")
          if not payload.get("id"):
              raise SystemExit(f"missing run id: {payload}")
          if payload.get("storage_durable") is not True:
              raise SystemExit(f"durable Vercel Blob storage was not confirmed: {payload}")
          if payload.get("live_data_confirmed") is not True:
              raise SystemExit(f"live Polymarket data was not confirmed: {payload}")
          print(json.dumps({
              "id": payload["id"],
              "previous_run_id": payload.get("previous_run_id"),
              "run_index": payload.get("run_index"),
              "candidate_count": payload.get("candidate_count"),
              "model_update_count": payload.get("model_update_count"),
              "correlation_rows": payload.get("correlation_rows"),
              "storage_durable": payload.get("storage_durable"),
              "live_data_confirmed": payload.get("live_data_confirmed"),
          }, indent=2, sort_keys=True))
          PY
