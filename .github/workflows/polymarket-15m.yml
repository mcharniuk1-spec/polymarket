name: Polymarket 15m Research Cycle

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      target_count:
        description: "Number of live Polymarket outcomes to collect"
        required: false
        default: "80"
      global_review:
        description: "Run global ML/correlation review"
        required: false
        default: "false"

jobs:
  run-managed-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from sports_edge.source_registry import SourceRegistry

          registry = SourceRegistry()
          errors = registry.validate()
          if errors:
              raise SystemExit("Invalid source registry:\n" + "\n".join(errors))
          counts = Counter(source.category for source in registry.sources)
          print("source_registry_ok", dict(sorted(counts.items())))
          PY

      - name: Run managed research cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_CRON_URL: ${{ secrets.VERCEL_CRON_URL || 'https://polymarket-research-dashboard.vercel.app' }}
          POLYMARKET_STATE_PREFIX: ${{ vars.POLYMARKET_STATE_PREFIX || 'polymarket/state' }}
          TARGET_COUNT: ${{ github.event.inputs.target_count || '80' }}
          GLOBAL_REVIEW_INPUT: ${{ github.event.inputs.global_review || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          HAS_LOCAL_DURABLE=false
          if [ -n "${DATABASE_URL:-}${POSTGRES_URL:-}${POSTGRES_PRISMA_URL:-}${POSTGRES_URL_NON_POOLING:-}${BLOB_READ_WRITE_TOKEN:-}" ]; then
            HAS_LOCAL_DURABLE=true
          fi
          REMOTE_CRON_BASE="${VERCEL_CRON_URL%/}"
          HAS_REMOTE_CRON=false
          if [ -n "${CRON_SECRET:-}" ] && [ -n "${REMOTE_CRON_BASE:-}" ]; then
            HAS_REMOTE_CRON=true
          fi

          if [ "${EVENT_NAME}" = "schedule" ]; then
            if [ "${SCHEDULE}" = "0 6 * * *" ] || [ "${SCHEDULE}" = "0 7 * * *" ]; then
              if [ "${HAS_REMOTE_CRON}" = "true" ]; then
                curl --fail --show-error --silent --max-time 90 \
                  -H "Authorization: Bearer ${CRON_SECRET}" \
                  "${REMOTE_CRON_BASE}/api/cron-daily?source=live&target_count=30" | tee response.json
                exit 0
              fi
              if [ "${HAS_LOCAL_DURABLE}" = "true" ]; then
                python3 -m sports_edge.cli run-daily --source live --target-count 30 | tee response.json
                exit 0
              fi
              echo "Missing scheduled cron execution credentials. Configure CRON_SECRET/VERCEL_CRON_URL or DATABASE_URL/POSTGRES_URL/BLOB_READ_WRITE_TOKEN in GitHub Actions secrets."
              exit 1
            fi

            if [ "${SCHEDULE}" = "*/15 * * * *" ]; then
              if [ "${HAS_REMOTE_CRON}" = "true" ]; then
                curl --fail --show-error --silent --max-time 90 \
                  -H "Authorization: Bearer ${CRON_SECRET}" \
                  "${REMOTE_CRON_BASE}/api/cron-collector?source=live&target_count=${TARGET_COUNT}" | tee response.json
                exit 0
              fi
              if [ "${HAS_LOCAL_DURABLE}" = "true" ]; then
                python3 -m sports_edge.cli run-collector --source live --target-count "${TARGET_COUNT}" | tee response.json
                exit 0
              fi
              echo "Missing scheduled cron execution credentials. Configure CRON_SECRET/VERCEL_CRON_URL or DATABASE_URL/POSTGRES_URL/BLOB_READ_WRITE_TOKEN in GitHub Actions secrets."
              exit 1
            fi
          fi

          if [ "${HAS_LOCAL_DURABLE}" = "false" ]; then
            echo "Missing durable storage secret; running non-scheduled fixture dry-run proof."
            python3 -m sports_edge.cli run-daily --source fixture --target-count 30 --dry-run | tee response.json
            exit 0
          fi

          GLOBAL_REVIEW="${GLOBAL_REVIEW_INPUT}"
          COMMAND=(python3 -m sports_edge.cli run-managed-cycle --source live --cycle-type manual --target-count "${TARGET_COUNT}")
          if [ "${GLOBAL_REVIEW}" = "true" ]; then
            COMMAND+=(--global-review)
          fi
          "${COMMAND[@]}" | tee response.json

      - name: Validate managed cycle result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("response.json").read_text())
          if payload.get("sourceMode") == "fixture" and payload.get("storage", {}).get("reason") == "dry_run":
              required = {
                  "ok": True,
                  "researchOnly": True,
                  "paperTradingOnly": True,
              }
              for key, expected in required.items():
                  actual = payload.get(key)
                  if actual != expected:
                      raise SystemExit(f"{key} expected {expected!r}, got {actual!r}: {payload}")
              if payload.get("storage", {}).get("written") is not False:
                  raise SystemExit(f"fixture dry-run unexpectedly wrote state: {payload}")
              print(json.dumps({
                  "status": "non_scheduled_fixture_dry_run",
                  "sourceMode": payload.get("sourceMode"),
                  "schemaValidation": payload.get("schemaValidation", {}),
                  "storage": payload.get("storage", {}),
              }, indent=2, sort_keys=True))
              raise SystemExit(0)

          if payload.get("collector") is True:
              required = {
                  "ok": True,
                  "researchOnly": True,
                  "paperTradingOnly": True,
                  "sourceMode": "live",
              }
              for key, expected in required.items():
                  actual = payload.get(key)
                  if actual != expected:
                      raise SystemExit(f"{key} expected {expected!r}, got {actual!r}: {payload}")
              status = payload.get("cronRun", {}).get("status")
              if status not in {"success", "duplicate_skipped"}:
                  raise SystemExit(f"bad collector status: {payload}")
              storage = payload.get("storage", {})
              if not (storage.get("written") is True or payload.get("duplicate") is True):
                  raise SystemExit(f"collector did not write and was not a duplicate: {payload}")
              print(json.dumps({
                  "run_id": payload.get("cronRun", {}).get("run_id"),
                  "status": status,
                  "idempotency_key": payload.get("idempotencyKey"),
                  "counts": payload.get("cronRun", {}).get("counts", {}),
              }, indent=2, sort_keys=True))
              raise SystemExit(0)

          if payload.get("dailyRunHourEuropeSofia") == 9:
              required = {
                  "ok": True,
                  "researchOnly": True,
                  "paperTradingOnly": True,
                  "sourceMode": "live",
              }
              for key, expected in required.items():
                  actual = payload.get(key)
                  if actual != expected:
                      raise SystemExit(f"{key} expected {expected!r}, got {actual!r}: {payload}")
              status = payload.get("cronRun", {}).get("status")
              if status not in {"success", "duplicate_skipped"}:
                  raise SystemExit(f"bad daily status: {payload}")
              storage = payload.get("storage", {})
              if not (storage.get("written") is True or payload.get("duplicate") is True):
                  raise SystemExit(f"daily did not write and was not a duplicate: {payload}")
              print(json.dumps({
                  "run_id": payload.get("cronRun", {}).get("run_id"),
                  "status": status,
                  "idempotency_key": payload.get("idempotencyKey"),
                  "counts": payload.get("cronRun", {}).get("counts", {}),
              }, indent=2, sort_keys=True))
              raise SystemExit(0)

          required = {
              "ok": True,
              "sourceMode": "live",
              "cycleType": "manual",
              "research_only": True,
              "live_data_confirmed": True,
          }
          for key, expected in required.items():
              actual = payload.get(key)
              if actual != expected:
                  raise SystemExit(f"{key} expected {expected!r}, got {actual!r}: {payload}")
          if payload.get("intelligence_status") not in {"success", "partial"}:
              raise SystemExit(f"bad intelligence_status: {payload}")
          if not payload.get("id"):
              raise SystemExit(f"missing run id: {payload}")
          if payload.get("storage_durable") is not True:
              raise SystemExit(
                  "durable storage was not confirmed. Configure one of "
                  "DATABASE_URL/POSTGRES_URL/POSTGRES_PRISMA_URL/POSTGRES_URL_NON_POOLING "
                  "or BLOB_READ_WRITE_TOKEN as a GitHub Actions secret. "
                  f"Payload: {payload}"
              )
          print(json.dumps({
              "id": payload["id"],
              "previous_run_id": payload.get("previous_run_id"),
              "run_index": payload.get("run_index"),
              "candidate_count": payload.get("candidate_count"),
              "model_update_count": payload.get("model_update_count"),
              "correlation_rows": payload.get("correlation_rows"),
              "storage_durable": payload.get("storage_durable"),
              "live_data_confirmed": payload.get("live_data_confirmed"),
          }, indent=2, sort_keys=True))
          PY

      - name: Vercel dashboard smoke check
        env:
          VERCEL_DASHBOARD_URL: ${{ secrets.VERCEL_DASHBOARD_URL || 'https://polymarket-research-dashboard.vercel.app/' }}
          VERCEL_HEALTH_URL: ${{ secrets.VERCEL_HEALTH_URL || 'https://polymarket-research-dashboard.vercel.app/api/health' }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 "${VERCEL_DASHBOARD_URL}" > /dev/null
          curl --fail --show-error --silent --max-time 20 "${VERCEL_HEALTH_URL}" > /dev/null || echo "Health endpoint is not deployed yet."
